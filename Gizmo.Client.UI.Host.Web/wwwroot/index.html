<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Client UI (WEB)</title>
    <base href="/" />
  </head>
  <body>
    <div id="app">Loading...</div>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
      // Load all satellite (localization) resource assemblies at startup so the UI can be
      // rendered in the server-provided culture. Blazor WebAssembly otherwise only loads
      // satellites for the boot culture, which leaves specific-culture translations (e.g.
      // ru-RU) unloaded and strings fall back to English.
      Blazor.start({
        configureRuntime: (builder) => {
          builder.withConfig({ loadAllSatelliteResources: true });
        }
      });
    </script>

    <script src="_content/Gizmo.Client.UI/client_internal_style.js"></script>
    <script src="_content/Gizmo.Client.UI/client_external_style.js"></script>

    <script src="_content/Gizmo.Client.UI/client_internal_code.js"></script>
    <script src="_content/Gizmo.Client.UI/client_external_code.js"></script>
    <script src="_content/Gizmo.Client.UI/client_api_code.js"></script>
  </body>
</html>
